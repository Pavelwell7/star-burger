services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: starburger_db
      POSTGRES_USER: starburger_user
      POSTGRES_PASSWORD: footmaster22
    volumes:
      - postgres_data:/var/lib/postgresql/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    command: ./node_modules/.bin/parcel watch bundles-src/index.js --dist-dir bundles --public-url="./"
    volumes:
      - .:/app
      - /app/node_modules

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env.docker
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - frontend

volumes:
  postgres_data:
